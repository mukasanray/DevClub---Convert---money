<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>DevClub - Convert Money</title>
</head>
<body>
    <img src="./assets/logo.gif" alt="logo-devclub-convert-money">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select>
                <option>US$ Dólar americano</option>
                <option>€ Euro</option>
            </select>
        </label>

        <label>
           Valor
           <input placeholder="R$ 10.000,00">
        </label>

        <batton>Converter</batton>

        <section>
            <div>
                <img src="./assets/real.png" alt="logo-moeda-a-converte">
                <p>Real</p>
                <p>R$ 0,00</p>
            </div>
            <img src="./assets/arrow.png" alt="seta">
            <div>
                <img src="./assets/dolar.png" alt="logo-moeda-convertida">
                <p>Dolar</p>
                <p>US$ 0.0</p>
            </div>
        </section>
    </main>

</body>

</html>
